# open-fire-suppression configuration
# This is the default configuration file.
# Environment overrides: FIRE_SENSORS__MQ2__ENABLED=false

system:
  name: open-fire-suppression
  mock_hardware: false
  log_level: INFO
  data_dir: /var/lib/fire-suppression

sensors:
  i2c_bus: 1
  scan_on_startup: true
  health_window_seconds: 10
  health_min_success_rate: 0.5
  poll_interval_seconds: 1.0

  ads1115:
    enabled: true
    address: 0x48
    gain: 1
    channels: [0, 1, 2, 3]

  mq2:
    enabled: true
    adc_channel: 0
    r0: 10000.0
    warmup_seconds: 60

  sht40:
    enabled: true
    address: 0x44

  mlx90614:
    enabled: true
    address: 0x5A

  bme680:
    enabled: true
    address: 0x77

  ens160:
    enabled: true
    address: 0x53
    warmup_seconds: 30

  amg8833:
    enabled: true
    address: 0x69

  mlx90640:
    enabled: false
    address: 0x33

  ds18b20:
    enabled: true
    base_path: /sys/bus/w1/devices

  picamera:
    enabled: true
    resolution: [1920, 1080]
    fps: 10

detection:
  enabled: true
  single_sensor_threshold:
    mq2_smoke_ppm: 300
    mlx90614_temp_c: 80.0
    sht40_temp_c: 60.0
    bme680_gas_resistance: 5000
    ens160_tvoc_ppb: 500
    ds18b20_temp_c: 70.0
  fusion_min_sensors: 2
  fusion_time_window_seconds: 5.0
  confidence_smoke_weight: 0.3
  confidence_temp_weight: 0.3
  confidence_gas_weight: 0.2
  confidence_video_weight: 0.2
  thermal_hotspot_min_c: 60.0
  thermal_hotspot_min_pixels: 4
  flicker_min_hz: 1.0
  flicker_max_hz: 12.0

actuation:
  enabled: true
  relay_count: 4
  relay_pins: [5, 6, 13, 19]
  relay_active_high: false
  pre_activation_seconds: 10
  suppression_duration_seconds: 60
  flow_sensor_pin: 26
  manual_button_pin: 21
  buzzer_pin: 20

safety:
  arming_required: true
  disarm_inhibits_all: true
  maintenance_pin: 16
  tamper_pin: 12
  watchdog_timeout_seconds: 30
  emergency_stop_pin: 7

power:
  ups_type: pisugar
  battery_adc_channel: 3
  voltage_divider_ratio: 2.0
  low_battery_percent: 20
  critical_battery_percent: 5
  ac_detect_pin: 25
  poll_interval_seconds: 5.0

telemetry:
  enabled: true
  db_path: /var/lib/fire-suppression/events.db
  max_db_size_mb: 100
  db_archives_keep: 10
  api_host: 0.0.0.0
  api_port: 8080
  websocket_interval_seconds: 1.0
  alert_channels: [buzzer]
