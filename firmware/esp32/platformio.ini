; PlatformIO project for ESP32 fire suppression sensor node
; Part of open-fire-suppression — see project root README for full feature list
;
; Build:   pio run
; Upload:  pio run -t upload
; Monitor: pio device monitor
; Test:    pio test

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform          = espressif32@^6.0.0
board             = esp32dev
framework         = arduino
monitor_speed     = 115200
upload_speed      = 921600
build_flags =
  -DCORE_DEBUG_LEVEL=0
lib_deps =
  adafruit/Adafruit SHT4x Library @ ^1.0.5
  adafruit/Adafruit MLX90614 Library @ ^2.1.6
  adafruit/Adafruit BME680 Library @ ^2.0.6
  adafruit/Adafruit AMG88xx Library @ ^1.3.2
  paulstoffregen/OneWire @ ^2.3.7
  milesburton/DallasTemperature @ ^3.11.0
  knolleary/PubSubClient @ ^2.8.0
  adafruit/Adafruit NeoPixel @ ^1.15.5
lib_ldf_mode      = deep+

; ── Native test environment (runs on host, no hardware) ──
[env:native]
platform    = native
build_flags = -Itest/mock -DUNIT_TEST -std=c++14
test_build_src = true
build_src_filter = +<../config.h> +<../types.h> +<detection/detection.cpp>